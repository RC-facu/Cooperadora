<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperadora ECMZ - Producto</title>
    <link rel="stylesheet" href="CSS/coope.css">
</head>
<body>

    <header>
    <div class="logo-container">
        <img src="images/Logo.png" alt="Escuela de Comercio Martín Zapata" class="logo-escuela">
        <h1>ECMZ <span>Cooperadora</span></h1>
    </div>
    <a class="cart-icon" id="btn-abrir-carrito" href="carrito.html" style="color:inherit;text-decoration:none;">
        🛒 <span id="cart-count">0</span>
    </a>
</header>

    <nav>
        <ul class="nav-links">
            <li><a href="Index.html">Inicio</a></li>
            <li><a href="Producto.html" class="active">Productos</a></li>
            <li><a href="Donacion.html">Donaciones</a></li>
            <li><a href="Registro.html">Registrarse</a></li>
            <li><a href="Contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <!-- Lista de productos: se ve cuando la URL no trae ?id= -->
        <section class="vista-secundaria" id="catalogo" hidden>
            <h2>Productos</h2>
            <p>Elegí un producto para ver su detalle.</p>
            <div class="productos-grid" id="grid-catalogo">
                <p>Cargando productos...</p>
            </div>
        </section>

        <!-- Detalle de UN producto: se ve cuando la URL trae ?id=4, por ejemplo -->
        <section class="vista-secundaria" id="detalle-producto" hidden>
            <p><a href="Producto.html" class="volver">&larr; Volver a productos</a></p>
            <h2>Detalle del Producto</h2>
            <div class="detalle-layout">
                <div class="detalle-galeria">
                    <div class="detalle-img" id="imagen-principal"></div>
                </div>
                <div class="detalle-info">
                    <h3 id="producto-nombre"></h3>
                    <p id="producto-descripcion"></p>

                    <div class="campo-opcion" id="campo-talle">
                        <label for="talle">Talle:</label>
                        <select id="talle"></select>
                    </div>

                    <p class="precio-destacado" id="precio-producto">Precio: $000</p>
                    <p id="stock-producto"></p>
                    <button class="btn-accion" id="btn-agregar-carrito">Agregar al carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Escuela de Comercio Martín Zapata - UNCUYO</p>
    </footer>

<script src="JS/Coopera.js"></script>
</body>
</html>
