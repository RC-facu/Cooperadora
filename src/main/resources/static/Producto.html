<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperadora ECMZ - Producto</title>
    <link rel="stylesheet" href="CSS/coope.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>ecmz <span>Cooperadora</span></h1>
        </div>
        <div class="cart-icon">
            🛒 <span id="cart-count">0</span>
        </div>
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="producto.html" class="active">Productos</a></li>
            <li><a href="donacion.html">Donaciones</a></li>
            <li><a href="registro.html">Registrarse</a></li>
            <li><a href="contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section class="vista-secundaria">
            <h2>Detalle del Producto</h2>
            <div class="detalle-layout">
                <div class="detalle-img">
                    👕 XXXL
                </div>
                <div class="detalle-info">
                    <h3>Remera Oficial ECMZ</h3>
                    <div class="campo-opcion">
                        <label for="color">Color:</label>
                        <select id="color">
                            <option value="azul">Azul</option>
                            <option value="blanco">Blanco</option>
                        </select>
                    </div>

                    <div class="campo-opcion">
                        <label for="talle">Talle:</label>
                        <select id="talle">
                            <option value="s">S</option>
                            <option value="m">M</option>
                            <option value="l">L</option>
                            <option value="xl">XL</option>
                            <option value="xxxl">XXXL</option>
                        </select>
                    </div>

                    <p class="precio-destacado">Precio: $000</p>
                    <button class="btn-accion" id="btn-agregar-carrito">Agregar al carrito</button>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <p>Escuela de Comercio Martín Zapata - UNCUYO</p>
    </footer>

</body>
</html>
