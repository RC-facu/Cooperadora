<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cooperadora ECMZ - Carrito</title>
    <link rel="stylesheet" href="CSS/coope.css">
</head>
<body>

    <header>
        <div class="logo-container">
            <h1>ecmz <span>Cooperadora</span></h1>
        </div>
        <a class="cart-icon" href="carrito.html" style="color:inherit;text-decoration:none;">
            🛒 <span id="cart-count">0</span>
        </a>
    </header>

    <nav>
        <ul class="nav-links">
            <li><a href="Index.html">Inicio</a></li>
            <li><a href="Producto.html">Productos</a></li>
            <li><a href="Donacion.html">Donaciones</a></li>
            <li><a href="Registro.html">Registrarse</a></li>
            <li><a href="Contacto.html">Contacto</a></li>
        </ul>
    </nav>

    <main>
        <section class="vista-secundaria">
            <h2>Carrito</h2>
            <div class="lista-carrito" id="lista-carrito"></div>
            <div class="total-carrito"><h3 id="total-carrito">Suma Total: $0</h3></div>

            <div class="contenedor-formulario-pago">
                <h3>Tus datos para coordinar el pago</h3>
                <div class="grupo-campo">
                    <label for="nombre-tutor">Tu nombre y apellido:</label>
                    <input type="text" id="nombre-tutor" placeholder="Juan Pérez">
                </div>
                <div class="grupo-campo">
                    <label for="nombre-alumno">Nombre del alumno/a:</label>
                    <input type="text" id="nombre-alumno" placeholder="Lucía Pérez">
                </div>
                <div class="grupo-campo">
                    <label for="curso-alumno">Curso:</label>
                    <input type="text" id="curso-alumno" placeholder="3° B">
                </div>

                <button class="btn-donar-ya" id="btn-whatsapp">Enviar pedido por WhatsApp</button>
                <p><em>El pago no se hace en esta página: se coordina por WhatsApp con la Cooperadora.</em></p>
            </div>

            <button class="btn-accion" id="btn-vaciar">Vaciar carrito</button>
        </section>
    </main>

    <footer>
        <p>Escuela de Comercio Martín Zapata - UNCUYO</p>
    </footer>

<script src="JS/Coopera.js"></script>
</body>
</html>
